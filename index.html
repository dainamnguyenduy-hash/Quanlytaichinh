<style>
  /* Layout: một cột kiểu điện thoại (max 448px), thẻ bo tròn, thanh điều hướng cố định phía dưới với nút + nổi ở giữa. */

    --bg: #1B1410; --card: #2A201A; --ink: #FFF8F2; --muted: #E4D5CA; --line: #4D2E2E;
    --accent: #F79A52; --accent-soft: #4A3022; --on-accent: #1B1410;

    --good: #4CC38A; --warn: #F2C037; --bad: #FF6B7A;

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1410; --card: #2A201A; --ink: #FFF8F2; --muted: #E4D5CA; --line: #4D2E2E;

      --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1410; --card: #2A201A; --ink: #FFF8F2; --muted: #E4D5CA; --line: #4D2E2E;
    --accent: #F79A52; --accent-soft: #4A3022; --on-accent: #1B1410;
    --hero-a: #9A3412; --hero-b: #C2500E;
    --good: #4CC38A; --warn: #F2C037; --bad: #FF6B7A;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);

  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  .card { background: var(--card); border-radius: 22px; box-shadow: var(--shadow); }
  .hero { background: linear-gradient(135deg, var(--hero-a), var(--hero-b)); color: #fff; border-radius: 28px; box-shadow: var(--shadow); }
  .muted { color: var(--muted); }
  .chip { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 13px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn { border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 13px; }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-soft { background: var(--accent-soft); color: var(--accent); }
  .btn-ghost { border: 1.5px solid var(--line); color: var(--muted); }
  .field { width: 100%; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 14px; padding: 12px 14px; font-size: 16px; font-family: inherit; }
  .field:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { cursor: pointer; font-family: inherit; }
  button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav { background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(120, 60, 20, 0.07);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .track { background: var(--line); border-radius: 999px; height: 10px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
  .sheet-in { animation: up .22s ease-out; }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .sheet-in { animation: none; } .fill { transition: none; } }
  .scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .scroll-x::-webkit-scrollbar { display: none; }
  details > summary { list-style: none; cursor: pointer; }

<!-- LOGIC: dữ liệu mẫu, gộp theo ngày/tháng/năm, so sánh kỳ (thuần JS, không phụ thuộc giao diện) -->
<script id="fin-logic">
(function () {
  var CATS = [
    { id: 'giaoduc', name: 'Giáo dục', icon: 'GraduationCap', color: 'var(--c1)' },
    { id: 'thietyeu', name: 'Thiết yếu', icon: 'ShoppingBasket', color: 'var(--c2)' },
    { id: 'sinhhoat', name: 'Sinh hoạt', icon: 'Coffee', color: 'var(--c3)' },
    { id: 'khac', name: 'Khác', icon: 'MoreHorizontal', color: 'var(--c4)' }
  ];
  var CAT_BY_ID = {};
  CATS.forEach(function (c) { CAT_BY_ID[c.id] = c; });
  var WD = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];

  function pad(n) { return String(n).padStart(2, '0'); }
  function fmtKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function startOf(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function startOfWeek(d) { var x = startOf(d); return addDays(x, -((x.getDay() + 6) % 7)); } // tuần bắt đầu từ Thứ Hai
  function addMonthKeepDay(d, n) {
    var last = new Date(d.getFullYear(), d.getMonth() + n + 1, 0).getDate();
    return new Date(d.getFullYear(), d.getMonth() + n, Math.min(d.getDate(), last));
  }
  function daysBetween(a, b) { return Math.round((startOf(b) - startOf(a)) / 86400000); }
  function dmy(d) { return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeSeed(today) {
    var t = startOf(today);
    var rnd = mulberry32(20261029), n = 0, ex = [], inc = [];
    function rr(min, max) { return Math.round((min + rnd() * (max - min)) / 1000) * 1000; }
    function pick(a) { return a[Math.floor(rnd() * a.length)]; }
    function add(date, cat, amount, note) { ex.push({ id: 'e' + (++n), date: date, cat: cat, amount: amount, note: note }); }
    var notes = {
      thietyeu: ['Đi chợ', 'Tiền điện', 'Xăng xe', 'Siêu thị', 'Tiền nước'],
      sinhhoat: ['Cà phê', 'Ăn tối', 'Xem phim', 'Trà sữa', 'Cắt tóc', 'Đi chơi'],
      giaoduc: ['Sách', 'Khóa học online', 'Văn phòng phẩm', 'Tài liệu ôn thi'],
      khac: ['Quà tặng', 'Ủng hộ', 'Phát sinh', 'Sửa đồ']
    };
    for (var i = 400; i >= 0; i--) {
      var d = addDays(t, -i), k = fmtKey(d), dom = d.getDate();
      if (dom === 1) add(k, 'thietyeu', 2500000, 'Tiền thuê nhà');
      if (dom === 5) {
        add(k, 'giaoduc', 1200000, 'Học phí tiếng Anh');
        inc.push({ id: 'i' + (++n), date: k, amount: 18000000, note: 'Lương tháng' });
      }
      if (dom === 18 && rnd() < 0.6) inc.push({ id: 'i' + (++n), date: k, amount: rr(2000000, 4000000), note: 'Việc làm thêm' });
      if (rnd() < 0.42) add(k, 'thietyeu', rr(40000, 380000), pick(notes.thietyeu));
      if (rnd() < 0.5) add(k, 'sinhhoat', rr(30000, 340000), pick(notes.sinhhoat));
      if (rnd() < 0.1) add(k, 'giaoduc', rr(100000, 600000), pick(notes.giaoduc));
      if (rnd() < 0.18) add(k, 'khac', rr(20000, 300000), pick(notes.khac));
    }
    function inDays(x) { return fmtKey(addDays(t, x)); }
    return {
      expenses: ex,
      incomes: inc,
      openingBalance: 12500000,
      budgets: { giaoduc: 3000000, thietyeu: 6500000, sinhhoat: 4000000, khac: 1500000 },
      subscriptions: [
        { id: 's1', name: 'Netflix', icon: 'Tv', price: 260000, next: inDays(1), active: true },
        { id: 's2', name: 'Spotify', icon: 'Music', price: 59000, next: inDays(3), active: true },
        { id: 's3', name: 'iCloud 50GB', icon: 'Cloud', price: 19000, next: inDays(6), active: true },
        { id: 's4', name: 'Phòng gym', icon: 'Dumbbell', price: 450000, next: inDays(12), active: true },
        { id: 's5', name: 'YouTube Premium', icon: 'Play', price: 79000, next: inDays(20), active: true }
      ]
    };
  }

  function sumBetween(list, fromKey, toKey, cat) {
    var s = 0;
    for (var i = 0; i < list.length; i++) {
      var e = list[i];
      if (e.date >= fromKey && e.date <= toKey && (!cat || e.cat === cat)) s += e.amount;
    }
    return s;
  }

  // kind: 'month' | 'week'; mode: 'same' (cùng số ngày) | 'full' (cả kỳ trước)
  function compare(expenses, today, kind, mode) {
    var t = startOf(today), curFrom, prevFrom, prevTo;
    if (kind === 'month') {
      curFrom = new Date(t.getFullYear(), t.getMonth(), 1);
      prevFrom = new Date(t.getFullYear(), t.getMonth() - 1, 1);
      var prevLast = new Date(t.getFullYear(), t.getMonth(), 0);
      prevTo = mode === 'full' ? prevLast : new Date(prevFrom.getFullYear(), prevFrom.getMonth(), Math.min(t.getDate(), prevLast.getDate()));
    } else {
      curFrom = startOfWeek(t);
      prevFrom = addDays(curFrom, -7);
      prevTo = mode === 'full' ? addDays(curFrom, -1) : addDays(prevFrom, daysBetween(curFrom, t));
    }
    var cur = sumBetween(expenses, fmtKey(curFrom), fmtKey(t));
    var prev = sumBetween(expenses, fmtKey(prevFrom), fmtKey(prevTo));
    return {
      cur: cur, prev: prev, diff: cur - prev,
      pct: prev > 0 ? ((cur - prev) / prev) * 100 : null,
      curFrom: curFrom, curTo: t, prevFrom: prevFrom, prevTo: prevTo
    };
  }

  // gran: 'day' (14 ngày gần nhất) | 'month' (12 tháng) | 'year' (từ năm đầu tiên có dữ liệu)
  function buildSeries(expenses, gran, today) {
    var t = startOf(today), rows = [], map = {}, i, d, key, row;
    function mk(key, short, long) {
      row = { key: key, short: short, long: long, total: 0 };
      CATS.forEach(function (c) { row[c.id] = 0; });
      map[key] = row; rows.push(row);
    }
    if (gran === 'day') {
      for (i = 13; i >= 0; i--) { d = addDays(t, -i); mk(fmtKey(d), pad(d.getDate()), WD[d.getDay()] + ', ' + dmy(d) + '/' + d.getFullYear()); }
    } else if (gran === 'month') {
      for (i = 11; i >= 0; i--) {
        d = new Date(t.getFullYear(), t.getMonth() - i, 1);
        mk(d.getFullYear() + '-' + pad(d.getMonth() + 1), 'T' + (d.getMonth() + 1), 'Tháng ' + (d.getMonth() + 1) + '/' + d.getFullYear());
      }
    } else {
      var minY = t.getFullYear();
      expenses.forEach(function (e) { var y = +e.date.slice(0, 4); if (y < minY) minY = y; });
      for (var y = minY; y <= t.getFullYear(); y++) mk(String(y), String(y), 'Năm ' + y);
    }
    expenses.forEach(function (e) {
      key = gran === 'day' ? e.date : gran === 'month' ? e.date.slice(0, 7) : e.date.slice(0, 4);
      var r = map[key];
      if (r) { r[e.cat] += e.amount; r.total += e.amount; }
    });
    return rows;
  }

  window.FinLogic = {
    CATS: CATS, CAT_BY_ID: CAT_BY_ID, WD: WD,
    pad: pad, fmtKey: fmtKey, parseKey: parseKey, startOf: startOf, addDays: addDays, startOfWeek: startOfWeek,
    addMonthKeepDay: addMonthKeepDay, daysBetween: daysBetween, dmy: dmy,
    makeSeed: makeSeed, sumBetween: sumBetween, compare: compare, buildSeries: buildSeries
  };
})();
</script>

<!-- GIAO DIỆN -->
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect } = React;
const F = window.FinLogic;
const { CATS, CAT_BY_ID } = F;
const R = window.Recharts || {};
const LUCIDE = window.lucideReact || window['lucide-react'] || window.LucideReact || {};

const Icon = ({ name, size = 20, strokeWidth = 2, className = '' }) => {
  const C = LUCIDE[name];
  return C ? <C size={size} strokeWidth={strokeWidth} className={className} aria-hidden="true" /> : <span style={{ display: 'inline-block', width: size, height: size }} />;
};

const nf = new Intl.NumberFormat('vi-VN');
const money = (n) => nf.format(Math.round(n)) + ' ₫';
const compact = (n) => n >= 1e6 ? (Math.round(n / 1e5) / 10).toString().replace('.', ',') + 'tr' : n >= 1e3 ? Math.round(n / 1e3) + 'k' : String(n);
const pctText = (p) => p.toLocaleString('vi-VN', { maximumFractionDigits: 1 }) + '%';
const tint = (v, a = 16) => `color-mix(in srgb, ${v} ${a}%, transparent)`;

/* ---------- Thành phần nhỏ ---------- */
function Delta({ pct }) {
  if (pct === null) return <span className="text-xs muted">Chưa có dữ liệu kỳ trước</span>;
  const down = pct < -0.05, up = pct > 0.05;
  const color = down ? 'var(--good)' : up ? 'var(--bad)' : 'var(--muted)';
  return (
    <span className="inline-flex items-center gap-1 font-bold tabular" style={{ color }}>
      <Icon name={down ? 'ArrowDownRight' : up ? 'ArrowUpRight' : 'Minus'} size={18} strokeWidth={2.6} />
      {down ? 'Giảm ' : up ? 'Tăng ' : 'Không đổi '}{pct !== 0 && Math.abs(pct) > 0.05 ? pctText(Math.abs(pct)) : ''}
    </span>
  );
}

function CatBadge({ id, size = 40 }) {
  const c = CAT_BY_ID[id];
  return (
    <span className="grid place-items-center shrink-0" style={{ width: size, height: size, borderRadius: size * 0.34, background: tint(c.color, 18), color: c.color }}>
      <Icon name={c.icon} size={size * 0.5} />
    </span>
  );
}

function SectionTitle({ children, right }) {
  return (
    <div className="flex items-center justify-between mb-3 mt-7 px-1">
      <h2 className="text-base font-extrabold">{children}</h2>
      {right}
    </div>
  );
}

/* ---------- Trang chủ ---------- */
function BalanceHero({ balance, income, expense, cmp, hidden, setHidden }) {
  return (
    <section className="hero p-5" aria-label="Tổng quan tài chính">
      <div className="flex items-center justify-between">
        <span className="text-sm font-medium" style={{ opacity: .92 }}>Số dư khả dụng</span>
        <button onClick={() => setHidden(!hidden)} aria-label={hidden ? 'Hiện số dư' : 'Ẩn số dư'} className="grid place-items-center w-9 h-9 rounded-full" style={{ background: 'rgba(255,255,255,.18)' }}>
          <Icon name={hidden ? 'EyeOff' : 'Eye'} size={18} />
        </button>
      </div>
      <div className="mt-1 text-[34px] leading-tight font-extrabold tabular tracking-tight">{hidden ? '••••••••' : money(balance)}</div>
      <div className="grid grid-cols-2 gap-3 mt-5">
        <div className="rounded-2xl p-3" style={{ background: 'rgba(255,255,255,.16)' }}>
          <div className="flex items-center gap-1.5 text-xs font-medium"><Icon name="TrendingUp" size={15} /> Thu tháng này</div>
          <div className="mt-1 font-bold tabular text-[15px]">{hidden ? '••••••' : money(income)}</div>
        </div>
        <div className="rounded-2xl p-3" style={{ background: 'rgba(255,255,255,.16)' }}>
          <div className="flex items-center gap-1.5 text-xs font-medium"><Icon name="TrendingDown" size={15} /> Chi tháng này</div>
          <div className="mt-1 font-bold tabular text-[15px]">{hidden ? '••••••' : money(expense)}</div>
        </div>
      </div>
      <div className="mt-3 inline-flex items-center gap-2 rounded-full px-3 py-1.5 text-xs" style={{ background: 'var(--card)', color: 'var(--ink)' }}>
        <Delta pct={cmp.pct} /> <span className="muted">so với cùng kỳ tháng trước</span>
      </div>
    </section>
  );
}

function CategoryGrid({ spentByCat, budgets, onOpen }) {
  return (
    <div className="grid grid-cols-2 gap-3">
      {CATS.map((c) => {
        const spent = spentByCat[c.id] || 0, pct = budgets[c.id] ? (spent / budgets[c.id]) * 100 : 0;
        return (
          <button key={c.id} onClick={() => onOpen(c.id)} className="card p-4 text-left" aria-label={`${c.name}: đã chi ${money(spent)}. Xem lịch sử`}>
            <CatBadge id={c.id} size={44} />
            <div className="mt-3 font-bold">{c.name}</div>
            <div className="tabular font-extrabold text-[17px] mt-0.5">{money(spent)}</div>
            <div className="text-xs muted mt-0.5 tabular">{budgets[c.id] ? Math.round(pct) + '% ngân sách' : 'Chưa đặt ngân sách'}</div>
          </button>
        );
      })}
    </div>
  );
}

function budgetState(pct) {
  if (pct > 100) return { color: 'var(--bad)', label: 'Vượt hạn mức', icon: 'AlertOctagon' };
  if (pct >= 80) return { color: 'var(--warn)', label: 'Sắp hết', icon: 'AlertTriangle' };
  return { color: 'var(--good)', label: 'Trong hạn mức', icon: 'CheckCircle2' };
}

function BudgetSection({ spentByCat, budgets }) {
  return (
    <div className="card p-4 flex flex-col gap-5">
      {CATS.map((c) => {
        const spent = spentByCat[c.id] || 0, limit = budgets[c.id] || 0, pct = limit ? (spent / limit) * 100 : 0;
        const st = budgetState(pct), left = limit - spent;
        return (
          <div key={c.id}>
            <div className="flex items-center gap-3">
              <CatBadge id={c.id} size={34} />
              <div className="flex-1 min-w-0">
                <div className="flex items-baseline justify-between gap-2">
                  <span className="font-bold">{c.name}</span>
                  <span className="text-xs font-bold tabular" style={{ color: st.color }}>{Math.round(pct)}%</span>
                </div>
                <div className="text-xs muted tabular">{money(spent)} / {money(limit)}</div>
              </div>
            </div>
            <div className="track mt-2.5" role="progressbar" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.min(100, Math.round(pct))} aria-label={`Ngân sách ${c.name}`}>
              <div className="fill" style={{ width: Math.min(100, pct) + '%', background: st.color }} />
            </div>
            <div className="flex items-center gap-1.5 mt-1.5 text-xs font-semibold" style={{ color: pct >= 80 ? st.color : 'var(--muted)' }}>
              <Icon name={!limit ? 'Info' : st.icon} size={14} />
              {!limit ? 'Chưa đặt hạn mức (vào Cài đặt để thiết lập)' : pct > 100 ? `Vượt ${money(-left)}` : pct >= 80 ? `Sắp hết · còn ${money(left)}` : `Còn ${money(left)}`}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function AddSubForm({ today, onAdd }) {
  const [open, setOpen] = useState(false);
  const [name, setName] = useState('');
  const [price, setPrice] = useState('');
  const [next, setNext] = useState(F.fmtKey(F.addDays(today, 7)));
  if (!open) return <button className="btn btn-soft w-full inline-flex items-center justify-center gap-1.5" onClick={() => setOpen(true)}><Icon name="Plus" size={15} /> Thêm gói cước</button>;
  const ok = name.trim() && Number(price) > 0 && next;
  const submit = (e) => { e.preventDefault(); if (!ok) return; onAdd({ name: name.trim(), price: Number(price), next }); setOpen(false); setName(''); setPrice(''); };
  return (
    <form className="card p-4 flex flex-col gap-3" onSubmit={submit}>
      <div>
        <label htmlFor="sub-name" className="text-xs font-bold muted">Tên gói</label>
        <input id="sub-name" className="field mt-1" maxLength={30} placeholder="Ví dụ: Netflix" value={name} onChange={(e) => setName(e.target.value)} />
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <label htmlFor="sub-price" className="text-xs font-bold muted">Giá mỗi tháng (₫)</label>
          <input id="sub-price" className="field mt-1 tabular" inputMode="numeric" placeholder="0" value={Number(price) ? nf.format(Number(price)) : ''} onChange={(e) => setPrice(e.target.value.replace(/\D/g, '').slice(0, 10))} />
        </div>
        <div>
          <label htmlFor="sub-next" className="text-xs font-bold muted">Ngày gia hạn tới</label>
          <input id="sub-next" type="date" className="field mt-1" value={next} onChange={(e) => setNext(e.target.value)} />
        </div>
      </div>
      <div className="grid grid-cols-2 gap-2">
        <button type="submit" className="btn btn-primary" disabled={!ok} style={{ opacity: ok ? 1 : .5 }}>Lưu gói</button>
        <button type="button" className="btn btn-ghost" onClick={() => setOpen(false)}>Đóng</button>
      </div>
    </form>
  );
}

function dueText(days) {
  if (days < 0) return `Quá hạn ${-days} ngày`;
  if (days === 0) return 'Gia hạn hôm nay';
  if (days === 1) return 'Gia hạn ngày mai';
  return `Gia hạn sau ${days} ngày`;
}

function SubscriptionSection({ subs, today, remind, onAdd, onRenew, onCancel, onReactivate }) {
  const rows = useMemo(() => subs.map((s) => ({ ...s, days: F.daysBetween(today, F.parseKey(s.next)) })).sort((a, b) => a.days - b.days), [subs, today]);
  const active = rows.filter((s) => s.active), cancelled = rows.filter((s) => !s.active);
  const isDue = (s) => remind && s.days <= 3;
  const dueSoon = active.filter(isDue), later = active.filter((s) => !isDue(s));
  const monthly = active.reduce((a, s) => a + s.price, 0);
  return (
    <div className="flex flex-col gap-3">
      <div className="card p-4 flex items-center justify-between">
        <div>
          <div className="text-xs muted">Tổng chi định kỳ mỗi tháng</div>
          <div className="text-lg font-extrabold tabular">{money(monthly)}</div>
        </div>
        <div className="text-right">
          <div className="text-xs muted">Đang hoạt động</div>
          <div className="text-lg font-extrabold tabular">{active.length} gói</div>
        </div>
      </div>

      {dueSoon.length > 0 && (
        <div className="flex items-center gap-2 px-1 text-sm font-bold" style={{ color: 'var(--accent)' }}>
          <Icon name="BellRing" size={18} /> {dueSoon.length} gói sắp gia hạn trong 3 ngày tới
        </div>
      )}
      {dueSoon.map((s) => (
        <div key={s.id} className="card p-4" style={{ outline: '2px solid var(--accent)', background: 'var(--card)' }}>
          <div className="flex items-center gap-3">
            <span className="grid place-items-center w-11 h-11 rounded-2xl shrink-0" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}><Icon name={s.icon} size={22} /></span>
            <div className="flex-1 min-w-0">
              <div className="font-bold truncate">{s.name}</div>
              <div className="text-xs font-bold" style={{ color: 'var(--accent)' }}>{dueText(s.days)} · {F.dmy(F.parseKey(s.next))}</div>
            </div>
            <div className="font-extrabold tabular">{money(s.price)}</div>
          </div>
          <div className="grid grid-cols-2 gap-2 mt-3">
            <button className="btn btn-primary inline-flex items-center justify-center gap-1.5" onClick={() => onRenew(s.id)}><Icon name="RefreshCw" size={15} /> Đã gia hạn</button>
            <button className="btn btn-ghost inline-flex items-center justify-center gap-1.5" style={{ color: 'var(--bad)', borderColor: 'var(--bad)' }} onClick={() => onCancel(s.id)}><Icon name="X" size={15} /> Hủy gói</button>
          </div>
        </div>
      ))}

      {later.length > 0 && (
        <div className="card px-4 py-1">
          {later.map((s, i) => (
            <div key={s.id} className="flex items-center gap-3 py-3" style={i ? { borderTop: '1px solid var(--line)' } : null}>
              <span className="grid place-items-center w-10 h-10 rounded-2xl shrink-0" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}><Icon name={s.icon} size={20} /></span>
              <div className="flex-1 min-w-0">
                <div className="font-semibold truncate">{s.name}</div>
                <div className="text-xs muted">{dueText(s.days)} · {F.dmy(F.parseKey(s.next))}</div>
              </div>
              <div className="font-bold tabular text-sm">{money(s.price)}</div>
              <button className="p-1.5 rounded-lg" style={{ color: 'var(--bad)' }} aria-label={`Hủy gói ${s.name}`} onClick={() => onCancel(s.id)}><Icon name="X" size={16} /></button>
            </div>
          ))}
        </div>
      )}

      {cancelled.length > 0 && (
        <div className="card px-4 py-2">
          <div className="text-xs font-bold muted pt-2 pb-1">Đã hủy</div>
          {cancelled.map((s) => (
            <div key={s.id} className="flex items-center gap-3 py-2.5">
              <span className="font-semibold muted line-through flex-1 truncate">{s.name}</span>
              <button className="btn btn-soft" onClick={() => onReactivate(s.id)}>Kích hoạt lại</button>
            </div>
          ))}
        </div>
      )}

      {rows.length === 0 && <div className="card p-6 text-center muted text-sm">Chưa theo dõi gói cước nào.</div>}
      <AddSubForm today={today} onAdd={onAdd} />
    </div>
  );
}

function TxnRow({ t, onDelete }) {
  const c = CAT_BY_ID[t.cat];
  return (
    <div className="flex items-center gap-3 py-3">
      <CatBadge id={t.cat} size={40} />

function HomeView({ d, hidden, setHidden, openCat, subsApi, setTab, remind }) {
  const recent = d.sorted.slice(0, 5);
  return (
    <>
      <BalanceHero balance={d.balance} income={d.monthIncome} expense={d.monthExpense} cmp={d.cmpMonth} hidden={hidden} setHidden={setHidden} />

/* ---------- Lịch sử ---------- */
function dayLabel(key, today) {
  const diff = F.daysBetween(F.parseKey(key), today), d = F.parseKey(key);
  if (diff === 0) return 'Hôm nay';
  if (diff === 1) return 'Hôm qua';
  return `${F.WD[d.getDay()]}, ${F.dmy(d)}/${d.getFullYear()}`;
}

function HistoryView({ d, filter, setFilter, onDelete }) {
  const [limit, setLimit] = useState(40);
  const list = useMemo(() => d.sorted.filter((t) => filter === 'all' || t.cat === filter), [d.sorted, filter]);
  const shown = list.slice(0, limit);
  const groups = useMemo(() => {
    const g = []; shown.forEach((t) => { const last = g[g.length - 1]; if (last && last.key === t.date) last.items.push(t); else g.push({ key: t.date, items: [t] }); });
    return g;
  }, [shown]);
  const total = list.reduce((a, t) => a + t.amount, 0);
  return (
    <>
      <h1 className="text-2xl font-extrabold mb-4">Lịch sử chi tiêu</h1>
      <div className="scroll-x flex gap-2 pb-1 -mx-1 px-1">
        <button className="chip" aria-pressed={filter === 'all'} onClick={() => setFilter('all')}>Tất cả</button>
        {CATS.map((c) => <button key={c.id} className="chip" aria-pressed={filter === c.id} onClick={() => setFilter(c.id)}>{c.name}</button>)}
      </div>
      <div className="card p-4 mt-4 flex items-center justify-between">
        <span className="text-sm muted">{list.length} khoản chi</span>
        <span className="font-extrabold tabular">{money(total)}</span>
      </div>
      {groups.map((g) => (
        <div key={g.key} className="mt-5">
          <div className="flex items-center justify-between px-1 mb-2">
            <span className="text-sm font-bold">{dayLabel(g.key, d.today)}</span>
            <span className="text-xs muted tabular">{money(g.items.reduce((a, t) => a + t.amount, 0))}</span>
          </div>
          <div className="card px-4">
            {g.items.map((t, i) => <div key={t.id} style={i ? { borderTop: '1px solid var(--line)' } : null}><TxnRow t={t} onDelete={onDelete} /></div>)}
          </div>
        </div>
      ))}
      {list.length === 0 && <div className="card p-8 mt-5 text-center muted">Chưa có khoản chi nào trong mục này.</div>}
      {list.length > limit && <button className="btn btn-soft w-full mt-5" onClick={() => setLimit(limit + 40)}>Xem thêm</button>}
    </>
  );
}

function CompareCard({ title, cmp, kind }) {
  const rng = (a, b) => `${F.dmy(a)} – ${F.dmy(b)}`;
  return (
    <div className="card p-4">
      <div className="text-xs font-bold muted">{title}</div>
      <div className="mt-2"><Delta pct={cmp.pct} /></div>
      <div className="mt-3 flex flex-col gap-1.5 text-xs">
        <div className="flex justify-between gap-2"><span className="muted">{kind === 'month' ? 'Tháng này' : 'Tuần này'} ({rng(cmp.curFrom, cmp.curTo)})</span></div>
        <div className="font-extrabold text-[15px] tabular">{money(cmp.cur)}</div>
        <div className="flex justify-between gap-2"><span className="muted">{kind === 'month' ? 'Tháng trước' : 'Tuần trước'} ({rng(cmp.prevFrom, cmp.prevTo)})</span></div>

          <span className="flex items-center gap-1.5"><span style={{ width: 9, height: 9, borderRadius: 3, background: c.color }} />{c.name}</span>
          <span className="tabular font-semibold">{money(row[c.id])}</span>

      <div className="flex justify-between mt-1.5 pt-1.5 font-extrabold" style={{ borderTop: '1px solid var(--line)' }}><span>Tổng</span><span className="tabular">{money(row.total)}</span></div>

}

        <CompareCard title="Tuần này so với tuần trước" cmp={cmpWeek} kind="week" />

/* ---------- Cài đặt ---------- */
function Toggle({ on, onChange, label }) {
  return (
    <button role="switch" aria-checked={on} aria-label={label} onClick={() => onChange(!on)} className="relative shrink-0" style={{ width: 46, height: 28, borderRadius: 999, background: on ? 'var(--accent)' : 'var(--line)', transition: 'background .2s' }}>
      <span style={{ position: 'absolute', top: 3, left: on ? 21 : 3, width: 22, height: 22, borderRadius: 999, background: on ? 'var(--on-accent)' : 'var(--muted)', transition: 'left .2s' }} />
    </button>
  );
}

function BackupCard({ getBackup, onRestore }) {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState('');
  const copy = async () => {
    const t = getBackup();
    setText(t);
    try { await navigator.clipboard.writeText(t); setMsg('Đã sao chép. Hãy dán vào ghi chú hoặc tin nhắn cho chính bạn để cất giữ.'); }
    catch (e) { setMsg('Không tự sao chép được. Chạm vào khung bên dưới, chọn tất cả rồi sao chép.'); }
  };
  const restore = () => { const err = onRestore(text); setMsg(err || 'Đã khôi phục dữ liệu từ bản sao lưu.'); };
  return (
    <div className="card p-4">
      <p className="text-sm muted">Dữ liệu tự lưu trên trình duyệt của thiết bị này. Hãy sao lưu để không mất khi xóa dữ liệu duyệt web hoặc đổi máy.</p>
      <label htmlFor="backup-text" className="text-xs font-bold muted block mt-3">Bản sao lưu</label>
      <textarea id="backup-text" className="field mt-1" style={{ fontSize: 12, fontFamily: 'ui-monospace, Menlo, monospace', minHeight: 90 }} placeholder="Bấm “Sao chép dữ liệu” để tạo bản sao lưu, hoặc dán bản sao lưu cũ vào đây để khôi phục." value={text} onChange={(e) => setText(e.target.value)} />
      <div className="grid grid-cols-2 gap-2 mt-3">
        <button className="btn btn-soft inline-flex items-center justify-center gap-1.5" onClick={copy}><Icon name="Table" size={15} /> Sao chép dữ liệu</button>
        <button className="btn btn-primary" onClick={restore} disabled={!text.trim()} style={{ opacity: text.trim() ? 1 : .5 }}>Khôi phục</button>
      </div>
      {msg && <div className="mt-3 text-sm font-semibold" role="status" style={{ color: 'var(--accent)' }}>{msg}</div>}
    </div>
  );
}

function SettingsView({ budgets, setBudgets, hidden, setHidden, remind, setRemind, onReset, onClear, getBackup, onRestore }) {
  const [confirm, setConfirm] = useState(false);
  const [confirmClear, setConfirmClear] = useState(false);
  return (
    <>
      <h1 className="text-2xl font-extrabold mb-4">Cài đặt</h1>
      <SectionTitle>Hạn mức ngân sách hằng tháng</SectionTitle>
      <div className="card p-4 flex flex-col gap-4">
        {CATS.map((c) => (
          <label key={c.id} htmlFor={'bud-' + c.id} className="flex items-center gap-3">
            <CatBadge id={c.id} size={36} />
            <span className="flex-1 font-semibold">{c.name}</span>
            <span className="relative">
              <input id={'bud-' + c.id} className="field tabular text-right" style={{ width: 150, paddingRight: 30 }} inputMode="numeric"
                value={nf.format(budgets[c.id] || 0)}
                onChange={(e) => setBudgets({ ...budgets, [c.id]: Number(e.target.value.replace(/\D/g, '')) || 0 })} />
              <span className="absolute right-3 top-1/2 -translate-y-1/2 muted text-sm">₫</span>
            </span>
          </label>
        ))}
      </div>
      <SectionTitle>Tùy chọn</SectionTitle>
      <div className="card px-4">
        <div className="flex items-center gap-3 py-3.5">
          <div className="flex-1"><div className="font-semibold">Nhắc gia hạn gói cước</div><div className="text-xs muted">Nổi bật gói sắp đến hạn trong 3 ngày</div></div>
          <Toggle on={remind} onChange={setRemind} label="Nhắc gia hạn gói cước" />
        </div>
        <div className="flex items-center gap-3 py-3.5" style={{ borderTop: '1px solid var(--line)' }}>
          <div className="flex-1"><div className="font-semibold">Ẩn số dư</div><div className="text-xs muted">Che số tiền trên trang chủ</div></div>
          <Toggle on={hidden} onChange={setHidden} label="Ẩn số dư" />
        </div>
      </div>
      <SectionTitle>Sao lưu</SectionTitle>
      <BackupCard getBackup={getBackup} onRestore={onRestore} />
      <SectionTitle>Dữ liệu</SectionTitle>
      <div className="card p-4">
        <p className="text-sm muted">Ứng dụng bắt đầu với số liệu trống. Bạn có thể nạp dữ liệu mẫu để xem thử cách hoạt động; việc này sẽ thay thế dữ liệu hiện có.</p>
        {!confirm ? (
          <button className="btn btn-soft mt-3 inline-flex items-center gap-1.5" onClick={() => setConfirm(true)}><Icon name="RotateCcw" size={15} /> Nạp dữ liệu mẫu</button>
        ) : (
          <div className="mt-3 flex items-center gap-2">
            <button className="btn btn-primary" onClick={() => { onReset(); setConfirm(false); }}>Xác nhận nạp mẫu</button>
            <button className="btn btn-ghost" onClick={() => setConfirm(false)}>Giữ nguyên</button>
          </div>
        )}
        <div className="mt-4 pt-4" style={{ borderTop: '1px solid var(--line)' }}>
          <p className="text-sm muted">Xóa toàn bộ khoản chi, thu nhập, gói cước và đưa số dư về 0 để bắt đầu từ đầu. Hạn mức ngân sách được giữ lại.</p>
          {!confirmClear ? (
            <button className="btn btn-ghost mt-3 inline-flex items-center gap-1.5" style={{ color: 'var(--bad)', borderColor: 'var(--bad)' }} onClick={() => setConfirmClear(true)}><Icon name="Trash2" size={15} /> Xóa toàn bộ dữ liệu</button>
          ) : (
            <div className="mt-3 flex items-center gap-2">
              <button className="btn" style={{ background: 'var(--bad)', color: '#fff' }} onClick={() => { onClear(); setConfirmClear(false); }}>Xác nhận xóa hết</button>
              <button className="btn btn-ghost" onClick={() => setConfirmClear(false)}>Giữ nguyên</button>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

/* ---------- Thêm khoản chi nhanh ---------- */
function AddSheet({ today, onClose, onAdd, defaultCat }) {
  const [amount, setAmount] = useState('');
  const [cat, setCat] = useState(defaultCat || 'sinhhoat');
  const [date, setDate] = useState(F.fmtKey(today));
  const [note, setNote] = useState('');
  const [err, setErr] = useState('');
  useEffect(() => { const h = (e) => e.key === 'Escape' && onClose(); window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); }, [onClose]);
  const n = Number(amount) || 0;
  const submit = (e) => {
    e.preventDefault();
    if (n <= 0) return setErr('Nhập số tiền lớn hơn 0.');
    if (!date) return setErr('Chọn ngày chi tiêu.');
    onAdd({ amount: n, cat, date, note: note.trim() });
  };
  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center" role="dialog" aria-modal="true" aria-label="Thêm khoản chi">
      <div className="absolute inset-0" style={{ background: 'rgba(30,15,5,.5)' }} onClick={onClose} />
      <form onSubmit={submit} className="sheet-in relative w-full max-w-md p-5 pb-6" style={{ background: 'var(--card)', borderRadius: '28px 28px 0 0', paddingBottom: 'max(24px, env(safe-area-inset-bottom, 0px))', maxHeight: '92%', overflowY: 'auto' }}>
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-lg font-extrabold">Thêm khoản chi</h2>
          <button type="button" onClick={onClose} aria-label="Đóng" className="grid place-items-center w-9 h-9 rounded-full" style={{ background: 'var(--bg)' }}><Icon name="X" size={18} /></button>
        </div>
        <label htmlFor="add-amount" className="text-xs font-bold muted">Số tiền</label>
        <div className="relative mt-1">
          <input id="add-amount" autoFocus className="field tabular font-extrabold" style={{ fontSize: 26, paddingRight: 40 }} inputMode="numeric" placeholder="0"
            value={n ? nf.format(n) : ''} onChange={(e) => { setAmount(e.target.value.replace(/\D/g, '').slice(0, 11)); setErr(''); }} />
          <span className="absolute right-4 top-1/2 -translate-y-1/2 muted font-bold">₫</span>
        </div>
        <div className="scroll-x flex gap-2 mt-2">
          {[20000, 50000, 100000, 200000, 500000].map((v) => <button type="button" key={v} className="chip" onClick={() => { setAmount(String(v)); setErr(''); }}>{compact(v)}</button>)}
        </div>
        <div className="text-xs font-bold muted mt-4 mb-1.5">Danh mục</div>
        <div className="grid grid-cols-2 gap-2" role="radiogroup" aria-label="Danh mục">
          {CATS.map((c) => (
            <button type="button" key={c.id} role="radio" aria-checked={cat === c.id} onClick={() => setCat(c.id)} className="flex items-center gap-2.5 p-2.5 rounded-2xl text-left"
              style={{ border: `2px solid ${cat === c.id ? c.color : 'var(--line)'}`, background: cat === c.id ? tint(c.color, 12) : 'transparent' }}>
              <CatBadge id={c.id} size={32} /><span className="font-bold text-sm">{c.name}</span>
            </button>
          ))}
        </div>
        <div className="grid grid-cols-2 gap-3 mt-4">
          <div>
            <label htmlFor="add-date" className="text-xs font-bold muted">Ngày</label>
            <input id="add-date" type="date" className="field mt-1" value={date} max={F.fmtKey(today)} onChange={(e) => setDate(e.target.value)} />
          </div>
          <div>
            <label htmlFor="add-note" className="text-xs font-bold muted">Ghi chú</label>
            <input id="add-note" className="field mt-1" placeholder="Không bắt buộc" maxLength={40} value={note} onChange={(e) => setNote(e.target.value)} />
          </div>
        </div>
        {err && <div className="mt-3 text-sm font-semibold" role="alert" style={{ color: 'var(--bad)' }}>{err}</div>}
        <button type="submit" className="btn btn-primary w-full mt-5 text-base" style={{ padding: 14 }}>Lưu khoản chi</button>
      </form>
    </div>
  );
}

/* ---------- Thanh điều hướng ---------- */
function BottomNav({ tab, setTab, onAdd }) {
  const Item = ({ id, icon, label }) => (
    <button onClick={() => setTab(id)} aria-current={tab === id ? 'page' : undefined} className="flex-1 flex flex-col items-center gap-0.5 py-1" style={{ color: tab === id ? 'var(--accent)' : 'var(--muted)' }}>
      <Icon name={icon} size={22} strokeWidth={tab === id ? 2.6 : 2} />
      <span className="text-[11px] font-bold">{label}</span>
    </button>
  );
  return (
    <nav className="nav fixed inset-x-0 bottom-0 z-40" aria-label="Điều hướng chính">
      <div className="mx-auto max-w-md flex items-end pt-2 pb-1.5">
        <Item id="home" icon="Home" label="Trang chủ" />
        <Item id="history" icon="History" label="Lịch sử" />
        <div className="flex-1 flex justify-center">
          <button onClick={onAdd} aria-label="Thêm khoản chi nhanh" className="grid place-items-center -mt-7"
            style={{ width: 58, height: 58, borderRadius: 999, background: 'linear-gradient(135deg, #D9480F, #EA6A1A)', color: '#fff', boxShadow: '0 8px 20px rgba(217,72,15,.4)', border: '4px solid var(--card)' }}>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>
        <Item id="stats" icon="BarChart3" label="Thống kê" />
        <Item id="settings" icon="Settings" label="Cài đặt" />
      </div>
    </nav>
  );
}

/* ---------- Lưu trữ trong trình duyệt ---------- */
const STORE_KEY = 'quanlytaichinh-v1';
const ZERO_BUDGETS = { giaoduc: 0, thietyeu: 0, sinhhoat: 0, khac: 0 };
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if (s && Array.isArray(s.expenses)) {
      return { expenses: s.expenses, incomes: s.incomes || [], subscriptions: s.subscriptions || [], openingBalance: s.openingBalance || 0, budgets: { ...ZERO_BUDGETS, ...(s.budgets || {}) }, hidden: !!s.hidden, remind: s.remind !== false, nid: s.nid || 1 };
    }
  } catch (e) { /* bỏ qua: trình duyệt không cho lưu */ }
  return null;
}

/* ---------- Ứng dụng ---------- */
function App() {
  const today = useMemo(() => F.startOf(new Date()), []);
  const [seed, setSeed] = useState(() => loadStore() || { expenses: [], incomes: [], subscriptions: [], openingBalance: 0, budgets: ZERO_BUDGETS, hidden: false, remind: true, nid: 1 });
  const [expenses, setExpenses] = useState(seed.expenses);
  const [subs, setSubs] = useState(seed.subscriptions);
  const [budgets, setBudgets] = useState(seed.budgets);
  const [tab, setTab] = useState('home');
  const [filter, setFilter] = useState('all');
  const [sheet, setSheet] = useState(false);
  const [hidden, setHidden] = useState(seed.hidden);
  const [remind, setRemind] = useState(seed.remind);
  const [toast, setToast] = useState(null);
  const [nid, setNid] = useState(seed.nid);

  // Tự lưu mỗi khi dữ liệu thay đổi
  useEffect(() => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, expenses, incomes: seed.incomes, openingBalance: seed.openingBalance, subscriptions: subs, budgets, hidden, remind, nid }));
    } catch (e) { /* bỏ qua */ }
  }, [expenses, seed, subs, budgets, hidden, remind, nid]);

  const flash = (msg) => { setToast(msg); clearTimeout(window.__t); window.__t = setTimeout(() => setToast(null), 2600); };
  useEffect(() => { window.scrollTo(0, 0); }, [tab]);

  const d = useMemo(() => {
    const monthFrom = F.fmtKey(new Date(today.getFullYear(), today.getMonth(), 1)), todayKey = F.fmtKey(today);
    const monthByCat = {}; CATS.forEach((c) => { monthByCat[c.id] = F.sumBetween(expenses, monthFrom, todayKey, c.id); });
    const monthExpense = CATS.reduce((a, c) => a + monthByCat[c.id], 0);
    const monthIncome = F.sumBetween(seed.incomes, monthFrom, todayKey);
    const balance = seed.openingBalance + seed.incomes.reduce((a, x) => a + x.amount, 0) - expenses.reduce((a, x) => a + x.amount, 0);
    const sorted = [...expenses].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : String(b.id).localeCompare(String(a.id), 'en', { numeric: true })));
    return { today, expenses, subs, budgets, monthByCat, monthExpense, monthIncome, balance, sorted, cmpMonth: F.compare(expenses, today, 'month', 'same') };
  }, [expenses, subs, budgets, seed, today]);

  const addExpense = ({ amount, cat, date, note }) => {
    setExpenses((prev) => [...prev, { id: 'n' + nid, amount, cat, date, note }]); setNid(nid + 1); setSheet(false);
    flash(`Đã thêm ${money(amount)} vào ${CAT_BY_ID[cat].name}`);
  };
  const deleteExpense = (id) => { setExpenses((prev) => prev.filter((e) => e.id !== id)); flash('Đã xóa khoản chi'); };
  const subsApi = {
    onAdd: ({ name, price, next }) => { setSubs([...subs, { id: 's' + Date.now(), name, icon: 'RefreshCw', price, next, active: true }]); flash(`Đã thêm gói ${name}`); },
    onRenew: (id) => {
      const s = subs.find((x) => x.id === id);
      setSubs(subs.map((x) => x.id === id ? { ...x, next: F.fmtKey(F.addMonthKeepDay(F.parseKey(x.next), 1)) } : x));
      setExpenses((prev) => [...prev, { id: 'r' + nid, amount: s.price, cat: 'sinhhoat', date: F.fmtKey(today), note: 'Gia hạn ' + s.name }]); setNid(nid + 1);
      flash(`Đã gia hạn ${s.name}`);
    },
    onCancel: (id) => { const s = subs.find((x) => x.id === id); setSubs(subs.map((x) => x.id === id ? { ...x, active: false } : x)); flash(`Đã hủy gói ${s.name}`); },
    onReactivate: (id) => { const s = subs.find((x) => x.id === id); setSubs(subs.map((x) => x.id === id ? { ...x, active: true } : x)); flash(`Đã kích hoạt lại ${s.name}`); }
  };
  const reset = () => { const s = F.makeSeed(today); setSeed(s); setExpenses(s.expenses); setSubs(s.subscriptions); setBudgets(s.budgets); flash('Đã nạp dữ liệu mẫu'); };
  const clearAll = () => { setSeed({ ...seed, incomes: [], openingBalance: 0 }); setExpenses([]); setSubs([]); flash('Đã xóa toàn bộ dữ liệu'); };
  const getBackup = () => JSON.stringify({ v: 1, expenses, incomes: seed.incomes, openingBalance: seed.openingBalance, subscriptions: subs, budgets, nid });
  const restoreBackup = (text) => {
    try {
      const s = JSON.parse(text);
      if (!s || !Array.isArray(s.expenses)) return 'Dữ liệu sao lưu không hợp lệ.';
      setSeed({ ...seed, incomes: s.incomes || [], openingBalance: s.openingBalance || 0 });
      setExpenses(s.expenses); setSubs(s.subscriptions || []); setBudgets({ ...ZERO_BUDGETS, ...(s.budgets || {}) }); setNid(s.nid || nid);
      flash('Đã khôi phục dữ liệu');
      return null;
    } catch (e) { return 'Không đọc được bản sao lưu. Hãy dán đầy đủ nội dung đã sao chép.'; }
  };
  const openCat = (id) => { setFilter(id); setTab('history'); };

  const todayLabel = `${F.WD[today.getDay()]}, ${F.dmy(today)}/${today.getFullYear()}`;

  return (
    <div className="mx-auto max-w-md" style={{ paddingTop: 20, paddingBottom: 120 }}>
      {tab === 'home' && (
        <header className="flex items-center justify-between mb-4 px-1">
          <div>
            <div className="text-xs muted font-medium">{todayLabel}</div>
            <div className="text-2xl font-extrabold">Quản lý tài chính</div>
          </div>
          <span className="grid place-items-center w-11 h-11 rounded-full" style={{ background: 'var(--accent-soft)', color: 'var(--accent)' }}><Icon name="Wallet" size={22} /></span>
        </header>
      )}
      {tab === 'home' && <HomeView d={d} hidden={hidden} setHidden={setHidden} openCat={openCat} subsApi={subsApi} setTab={setTab} remind={remind} />}
      {tab === 'history' && <HistoryView d={d} filter={filter} setFilter={setFilter} onDelete={deleteExpense} />}
      {tab === 'stats' && <StatsView d={d} />}
      {tab === 'settings' && <SettingsView budgets={budgets} setBudgets={setBudgets} hidden={hidden} setHidden={setHidden} remind={remind} setRemind={setRemind} onReset={reset} onClear={clearAll} getBackup={getBackup} onRestore={restoreBackup} />}
      {sheet && <AddSheet today={today} onClose={() => setSheet(false)} onAdd={addExpense} defaultCat={tab === 'history' && filter !== 'all' ? filter : undefined} />}
      {toast && (
        <div role="status" className="fixed z-[60] left-0 right-0 flex justify-center pointer-events-none" style={{ bottom: 'calc(88px + env(safe-area-inset-bottom, 0px))' }}>
          <div className="px-4 py-2.5 rounded-2xl text-sm font-semibold" style={{ background: 'var(--ink)', color: 'var(--bg)', boxShadow: 'var(--shadow)' }}>{toast}</div>
        </div>
      )}
      <BottomNav tab={tab} setTab={setTab} onAdd={() => setSheet(true)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
